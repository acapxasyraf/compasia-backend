version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: compasia_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compasia_db
      MYSQL_USER: compasia_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - compasia-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: compasia_phpmyadmin
    links:
      - mysql:db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - compasia-network

volumes:
  mysql-data:

networks:
  compasia-network:
    driver: bridge
